[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digest-agent"
version = "0.1.0"
description = "Builds WhatsApp digests from the MCP server and DeepSeek"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[tool.setuptools]
py-modules = ["agent"]
