[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-mcp-server"
version = "0.1.0"
description = "WhatsApp MCP server"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.20.0,<2",
    "requests>=2.32.3",
]

[tool.setuptools]
py-modules = ["main", "whatsapp", "audio", "whisper_client"]
